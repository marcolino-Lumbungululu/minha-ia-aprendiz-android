name: Compilar APK da Minha IA Aprendiz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Extrair codigo do projeto
        run: |
          test -f minha_ia_apk_codigo.zip
          unzip -o minha_ia_apk_codigo.zip -d .

          test -f main.py
          test -f disciplinas.py
          test -f motor_ligacao.py
          test -f base_conhecimento.py
          test -f resposta_inteligente.py
          test -f conhecimento_inicial.db
          test -f buildozer.spec

      - name: Verificar sintaxe Python
        run: |
          python -m py_compile \
            main.py \
            disciplinas.py \
            motor_ligacao.py \
            base_conhecimento.py \
            resposta_inteligente.py

      - name: Aceitar licencas Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$SDK/licenses/android-sdk-license"

          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            >> "$SDK/licenses/android-sdk-license"

          printf '%s\n' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            > "$SDK/licenses/android-sdk-preview-license"

      - name: Compilar APK
        run: |
          buildozer android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Minha-IA-Aprendiz-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
