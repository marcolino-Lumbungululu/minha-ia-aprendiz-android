name: Compilar APK da Minha IA Aprendiz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer

      - name: Extrair codigo do projeto
        run: |
          test -f minha_ia_apk_codigo.zip
          unzip -o minha_ia_apk_codigo.zip -d .
          test -f main.py
          test -f disciplinas.py
          test -f motor_ligacao.py
          test -f base_conhecimento.py
          test -f resposta_inteligente.py
          test -f conhecimento_inicial.db
          test -f buildozer.spec

      - name: Verificar sintaxe Python
        run: |
          python -m py_compile \
            main.py \
            disciplinas.py \
            motor_ligacao.py \
            base_conhecimento.py \
            resposta_inteligente.py

      - name: Preparar ferramentas Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$HOME/.buildozer" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado."
            exit 1
          fi

          echo "A aceitar as licenças Android..."
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          echo "A instalar as ferramentas necessárias..."
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "A verificar a instalação do AIDL..."
          find "$SDK/build-tools" -type f -name aidl -print

      - name: Compilar APK
        run: |
          buildozer android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Minha-IA-Aprendiz-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
